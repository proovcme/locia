name: Browser source builds
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [atlas, pircalc]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Verify published runtime parity
        run: |
          if [ "${{ matrix.app }}" = atlas ]; then
            diff -rq ../../public/atlas dist-public-atlas
          else
            diff -rq ../../public/pircalc dist-public
          fi
