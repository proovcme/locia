name: self-host smoke

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  demo-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Audit public tree
        run: ./scripts/audit-public.sh
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Start public contour
        run: docker compose up --build -d
      - name: Probe pages and privacy boundary
        run: |
          ready=0
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/lemma/login >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          curl -fsS http://127.0.0.1:8080/ | grep -Fq 'Лемма'
          curl -fsS http://127.0.0.1:8080/atlas/ | grep -Fq 'Атлас'
          curl -fsS http://127.0.0.1:8080/pircalc/ | grep -Fq 'Формы 2П, 3П и 4П'
          curl -fsS http://127.0.0.1:8080/pdf-editor/ | grep -Fq 'PDF-редактор проектной документации'
          curl -fsS http://127.0.0.1:8080/pdf-editor/api/health | grep -Fq '"status":"ok"'
          curl -fsS http://127.0.0.1:8080/atlas/models/buildingsmart/catalog.json | grep -Fq 'ifc4x3-infra-road'
          test "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/.env)" = 404
      - name: Exercise PDF engine
        run: |
          docker compose exec -T pdf-editor python -c 'import pymupdf,sys; d=pymupdf.open(); p=d.new_page(); p.insert_text((72,72), "SYNTHETIC PDF"); sys.stdout.buffer.write(d.tobytes())' > /tmp/locia-pdf-smoke.pdf
          curl -fsS \
            -F 'payload={"args":["--inspect-json",{"input_pdf":"smoke.pdf"}]}' \
            -F 'virtual_paths=["smoke.pdf"]' \
            -F 'files=@/tmp/locia-pdf-smoke.pdf;type=application/pdf' \
            http://127.0.0.1:8080/pdf-editor/api/run \
            > /tmp/locia-pdf-response.json
          python3 -c 'import json; d=json.load(open("/tmp/locia-pdf-response.json")); assert d["ok"] and d["page_count"] == 1 and "/tmp/" not in str(d)'
          curl -fsS \
            -F 'payload={"args":["--job-json",{"input_pdf":"smoke.pdf","output_pdf":"rotated.pdf","make_previews":false,"rules":[],"page_operations":[{"type":"rotate","pages":"1","angle":90}]}]}' \
            -F 'virtual_paths=["smoke.pdf"]' \
            -F 'files=@/tmp/locia-pdf-smoke.pdf;type=application/pdf' \
            http://127.0.0.1:8080/pdf-editor/api/run \
            > /tmp/locia-pdf-result.json
          python3 -c 'import base64,json; d=json.load(open("/tmp/locia-pdf-result.json")); assert d["ok"] and d["page_operations"][0]["type"] == "rotate" and d["downloads"][0]["name"] == "rotated.pdf"; open("/tmp/rotated.pdf","wb").write(base64.b64decode(d["downloads"][0]["data"]))'
          docker compose exec -T pdf-editor python -c 'import pymupdf,sys; d=pymupdf.open(stream=sys.stdin.buffer.read(), filetype="pdf"); assert len(d) == 1 and d[0].rotation == 90' < /tmp/rotated.pdf
      - name: Logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop contour
        if: always()
        run: docker compose down -v

  work-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Create isolated work configuration
        run: ./scripts/init-work.sh ci@example.local >/dev/null
      - name: Validate work Compose
        run: docker compose --env-file .env.work -f compose.work.yml config --quiet
      - name: Start work contour
        run: docker compose --env-file .env.work -f compose.work.yml up --build -d --wait --wait-timeout 180
      - name: Probe login, persistence and backup
        run: |
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8080/login >/tmp/locia-login.html; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          grep -Fq 'Табельный номер или email' /tmp/locia-login.html
          curl -fsS http://127.0.0.1:8080/pdf-editor/ | grep -Fq 'PDF-редактор проектной документации'
          curl -fsS http://127.0.0.1:8080/pdf-editor/api/health | grep -Fq '"status":"ok"'
          set -a
          . ./.env.work
          set +a
          curl -fsS -c /tmp/locia-cookies.txt http://127.0.0.1:8080/login >/tmp/locia-login.html
          csrf=$(sed -n 's/.*name="_csrf" value="\([^"]*\)".*/\1/p' /tmp/locia-login.html | head -n 1)
          test -n "$csrf"
          login_status=$(curl -sS -o /dev/null -w '%{http_code}' -b /tmp/locia-cookies.txt -c /tmp/locia-cookies.txt \
            --data-urlencode "_csrf=$csrf" \
            --data-urlencode "login=$LOCIA_ADMIN_LOGIN" \
            --data-urlencode "password=$LOCIA_ADMIN_PASSWORD" \
            http://127.0.0.1:8080/login)
          test "$login_status" = 302
          curl -fsS -b /tmp/locia-cookies.txt http://127.0.0.1:8080/shturman | grep -Fq 'ЛОЦИЯ'
          test "$(docker compose --env-file .env.work -f compose.work.yml exec -T db sh -c 'mariadb -u"$MARIADB_USER" -p"$MARIADB_PASSWORD" "$MARIADB_DATABASE" -Nse "SELECT COUNT(*) FROM users"')" = 1
          test "$(docker compose --env-file .env.work -f compose.work.yml exec -T db sh -c 'mariadb -u"$MARIADB_USER" -p"$MARIADB_PASSWORD" "$MARIADB_DATABASE" -Nse "SELECT COUNT(*) FROM projects"')" = 0
          docker compose --env-file .env.work -f compose.work.yml restart lemma
          for attempt in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8080/login >/dev/null && break
            sleep 2
          done
          test "$(docker compose --env-file .env.work -f compose.work.yml exec -T db sh -c 'mariadb -u"$MARIADB_USER" -p"$MARIADB_PASSWORD" "$MARIADB_DATABASE" -Nse "SELECT COUNT(*) FROM users"')" = 1
          ./scripts/backup-work.sh /tmp/locia-backups
          test -s /tmp/locia-backups/*/database.sql
          test -s /tmp/locia-backups/*/storage.tar.gz
      - name: Logs on failure
        if: failure()
        run: docker compose --env-file .env.work -f compose.work.yml logs
      - name: Stop work contour
        if: always()
        run: docker compose --env-file .env.work -f compose.work.yml down -v
