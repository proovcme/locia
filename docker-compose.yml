services:
  pdf-editor:
    build:
      context: .
      dockerfile: docker/pdf-editor.Dockerfile
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=384m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 64
    mem_limit: 768m
    networks:
      - pdf-editor
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  lemma:
    build:
      context: .
      dockerfile: docker/lemma.Dockerfile
    environment:
      PORT: "8080"
      BIND_HOST: "0.0.0.0"
      APP_ENV: demo
      APP_DEBUG: "0"
      APP_URL: "${LOCIA_PUBLIC_ORIGIN:-http://localhost:8080}/lemma"
      DB_SQLITE_PATH: /data/demo.sqlite
      DEMO_SESSION_PATH: /data/sessions
      ATLAS_URL: "${LOCIA_PUBLIC_ORIGIN:-http://localhost:8080}/atlas/"
      DEMO_MODE: "1"
      MSP_SYNC_ENABLED: "0"
      MAIL_ENABLED: "0"
      MAIL_RELAY_ENABLED: "0"
      UPDATE_CENTER_ENABLED: "0"
      REVIT_INTEGRATION_ENABLED: "0"
    volumes:
      - lemma-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/login"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  web:
    image: caddy:2.10-alpine
    depends_on:
      lemma:
        condition: service_healthy
      pdf-editor:
        condition: service_healthy
    ports:
      - "${PUBLIC_PORT:-8080}:8080"
    networks:
      - default
      - pdf-editor
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - ./public/atlas:/srv/atlas:ro
      - ./public/pircalc:/srv/pircalc:ro
    restart: unless-stopped

volumes:
  lemma-data:

networks:
  pdf-editor:
    internal: true
